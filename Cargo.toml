[package]
name = "music-syncer"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "EUPL-1.2"
publish = false

[lints.cargo]
unused_dependencies = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
anyhow = "1.0.104"
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "file_chooser", "wayland", "raw_handle"] }
directories = "6.0.0"
gpui-kit = { version = "0.10.0", default-features = false, features = ["component", "assets"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
jiff = { version = "0.2.42", default-features = false, features = ["std"] }
lofty = "0.25.5"
palette = { version = "0.7.7", default-features = false, features = ["std"] }
percent-encoding = "2.3.2"
raw-window-handle = "0.6.2"
rustix = { version = "1.1.6", features = ["fs"] }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
